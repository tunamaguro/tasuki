[package]
name = "tasuki-postgres"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["rt-tokio"]
rt-tokio = ["dep:tokio", "tokio-postgres/runtime"]
deadpool-postgres = ["dep:deadpool-postgres"]

[dependencies]
tasuki-core = { workspace = true }

futures = { workspace = true }
futures-timer = { workspace = true }
pin-project-lite = { workspace = true }
tracing = { workspace = true }

tokio = { version = "1.0", default-features = false, features = [
    "time",
], optional = true }
deadpool-postgres = { version = "0.14.1", default-features = false, optional = true }

tokio-postgres = { version = "0.7.14", default-features = false }
postgres-types = { version = "0.2.10", features = [
    "derive",
    "with-serde_json-1",
    "with-uuid-1",
] }
bytes = { version = "1", default-features = false }
uuid = { version = "1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0",default-features = false}

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }
