[package]
name = "tasuki-postgres"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tasuki-core = { workspace = true }
tracing = { workspace = true }

tokio-postgres = { version = "0.7.14", features = [
    "with-serde_json-1",
    "with-uuid-1",
] }
postgres-types = { version = "0.2.10", features = [
    "derive",
    "with-serde_json-1",
    "with-uuid-1",
] }
bytes = "1"
uuid = "1"
serde = "^1.0"
serde_json = "^1.0"
